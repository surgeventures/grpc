[tools]
# 23.3.4.7 and 24.x have no precompiled OTP build for ubuntu-24.04 on
# builds.hex.pm (only OTP 25+ is precompiled there), so `mise install
# --locked` always fell back to a from-source build, which fails to
# compile on the ubuntu-24.04 CI runner's modern toolchain. Bumped to
# the nearest OTP/Elixir pair with a working precompiled build; mix.exs
# only requires elixir "~> 1.5" and the README's floor is "Erlang/OTP
# needs >= 20.3.2", so both are satisfied.
elixir = "1.13.4-otp-25"
erlang = "25.3.2.21"
